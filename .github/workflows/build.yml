name: Build rootless DEB

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dynamic-island-ls-color-16-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Generate Settings icon
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          data = base64.b64decode(Path('assets/DynamicIslandLSColor16.png.b64').read_text())
          targets = [
              Path('layout/Library/PreferenceLoader/Preferences/DynamicIslandLSColor16.png'),
              Path('prefs/layout/Library/PreferenceLoader/Preferences/DynamicIslandLSColor16.png'),
              Path('prefs/Resources/icon.png'),
          ]

          for target in targets:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
          PY

          for icon in             layout/Library/PreferenceLoader/Preferences/DynamicIslandLSColor16.png             prefs/layout/Library/PreferenceLoader/Preferences/DynamicIslandLSColor16.png             prefs/Resources/icon.png; do
            sips -z 29 29 "$icon" >/dev/null
          done

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build rootless package
        run: |
          chmod 755 layout/DEBIAN/postinst
          make clean package FINALPACKAGE=1

      - name: Validate package
        run: |
          set -euo pipefail
          brew install dpkg

          debs=(packages/*.deb)
          test "${#debs[@]}" -eq 1
          deb="${debs[0]}"

          test "$(dpkg-deb -f "$deb" Architecture)" = "iphoneos-arm64"
          test "$(dpkg-deb -f "$deb" Package)" = "com.551.dynamicislandlscolor16"
          test "$(dpkg-deb -f "$deb" Version)" = "0.2.2"

          root="$RUNNER_TEMP/dilscolor-check"
          dpkg-deb -x "$deb" "$root"

          dylib="$root/var/jb/Library/MobileSubstrate/DynamicLibraries/DynamicIslandLSColor16.dylib"
          filter="$root/var/jb/Library/MobileSubstrate/DynamicLibraries/DynamicIslandLSColor16.plist"
          prefs="$root/var/jb/Library/PreferenceBundles/DynamicIslandLSColor16Prefs.bundle"
          entry="$root/var/jb/Library/PreferenceLoader/Preferences/DynamicIslandLSColor16.plist"
          settingsIcon="$root/var/jb/Library/PreferenceLoader/Preferences/DynamicIslandLSColor16.png"

          test -s "$dylib"
          test -s "$filter"
          test -s "$prefs/DynamicIslandLSColor16Prefs"
          test -s "$prefs/icon.png"
          test -s "$entry"
          test -s "$settingsIcon"

          xcrun lipo "$dylib" -verify_arch arm64 arm64e
          xcrun lipo "$prefs/DynamicIslandLSColor16Prefs" -verify_arch arm64 arm64e
          plutil -lint "$filter"
          plutil -lint "$prefs/Info.plist"
          plutil -lint "$entry"

          test "$(sips -g pixelWidth "$settingsIcon" | awk '/pixelWidth/{print $2}')" = "29"
          test "$(sips -g pixelHeight "$settingsIcon" | awk '/pixelHeight/{print $2}')" = "29"
          test "$(sips -g pixelWidth "$prefs/icon.png" | awk '/pixelWidth/{print $2}')" = "29"
          test "$(sips -g pixelHeight "$prefs/icon.png" | awk '/pixelHeight/{print $2}')" = "29"

          /usr/libexec/PlistBuddy -c 'Print :entry:icon' "$entry" | grep -Fx '/var/jb/Library/PreferenceLoader/Preferences/DynamicIslandLSColor16.png'
          /usr/libexec/PlistBuddy -c 'Print :entry:iconImage' "$entry" | grep -Fx '/var/jb/Library/PreferenceLoader/Preferences/DynamicIslandLSColor16.png'

      - uses: actions/upload-artifact@v4
        with:
          name: DynamicIslandLSColor16-rootless
          path: packages/*.deb
          if-no-files-found: error

      - name: Publish latest DEB only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^Version: //p' control)"
          current="v${version}"

          if gh release view "$current" >/dev/null 2>&1; then
            gh release upload "$current" packages/*.deb --clobber
          else
            gh release create "$current" packages/*.deb               --target "$GITHUB_SHA"               --title "Dynamic Island LS Color 16 ${version}"               --notes "Reset Color now restores the stock iOS white colour."
          fi

          gh release list --limit 100 --json tagName --jq '.[].tagName' | while read -r tag; do
            [ "$tag" = "$current" ] && continue
            gh release delete "$tag" --cleanup-tag -y
          done
